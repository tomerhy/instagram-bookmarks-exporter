<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Instagram Media Gallery</title>
  <style>
    :root {
      color-scheme: dark;

      /* Brand */
      --ig-pink: #E1306C;
      --ig-pink-dark: #c13584;
      --ig-purple: #833ab4;
      --ig-violet: #5851DB;

      /* Semantic state — selection/active intentionally NOT pink so the
         primary CTA (Download) stays visually distinct from "you picked this". */
      --selected: #4F9DFF;
      --selected-glow: rgba(79, 157, 255, 0.40);

      /* Surfaces — flatter darker base with tinted layers above */
      --ig-bg:       #0a0a14;
      --surface-0:   rgba(255, 255, 255, 0.02);
      --surface-1:   rgba(255, 255, 255, 0.04);
      --surface-2:   rgba(255, 255, 255, 0.08);
      --surface-3:   rgba(255, 255, 255, 0.12);

      /* Glass — backdrop-blur surfaces */
      --glass-bg:    rgba(22, 22, 38, 0.6);
      --glass-bg-strong: rgba(22, 22, 38, 0.78);
      --glass-border:    rgba(255, 255, 255, 0.10);
      --glass-blur:  blur(20px) saturate(140%);

      /* Text — all WCAG AA against --ig-bg */
      --text-primary:   #f6f7fb;
      --text-secondary: #d4d4dc;
      --text-muted:     #a8a8b8;
      --text-dim:       #9090a4;

      /* Borders */
      --border-1: rgba(255, 255, 255, 0.10);
      --border-2: rgba(255, 255, 255, 0.18);

      /* Spacing scale (4/8px) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --radius-pill: 999px;

      /* Button heights */
      --btn-h-sm: 36px;
      --btn-h-md: 42px;
      --btn-h-lg: 48px;

      /* Motion — spring-physics for delightful overshoots */
      --t-fast: 140ms cubic-bezier(0.4, 0, 0.2, 1);
      --t-base: 220ms cubic-bezier(0.4, 0, 0.2, 1);
      --t-spring: 320ms cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Glow */
      --glow-pink:  0 0 30px rgba(225, 48, 108, 0.35);
      --glow-blue:  0 0 30px rgba(79, 157, 255, 0.35);
    }
    * {
      box-sizing: border-box;
    }
    /* Global keyboard focus ring — visible against the dark bg */
    *:focus-visible {
      outline: 2px solid var(--selected);
      outline-offset: 2px;
      border-radius: 4px;
    }
    /* Respect users with motion sensitivity */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .card:hover { transform: none !important; }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      margin: 0;
      padding: var(--space-6) var(--space-5);
      background: var(--ig-bg);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    /* Aurora ambient gradients — large blurred brand-color blobs floating
       behind content. The whole-page atmosphere is what makes a dark UI
       feel premium instead of utilitarian. */
    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
    }
    body::before {
      top: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--ig-pink) 0%, transparent 70%);
    }
    body::after {
      bottom: -300px;
      right: -200px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, var(--ig-violet) 0%, transparent 70%);
    }
    /* Everything else above the aurora */
    body > * { position: relative; z-index: 1; }

    h1 {
      margin: 0 0 var(--space-6);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      background: linear-gradient(135deg, #fff 0%, #a8a8b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #version {
      font-size: 11px;
      font-weight: 600;
      color: var(--ig-pink);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(225, 48, 108, 0.4);
      background: rgba(225, 48, 108, 0.10);
      -webkit-text-fill-color: var(--ig-pink);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* Toolbar — tabs left, search right. Stacks on narrow viewports. */
    .toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
      flex-wrap: wrap;
    }
    .search-box {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-2) 0 var(--space-3);
      height: 42px;
      min-width: 280px;
      max-width: 420px;
      flex: 1 0 240px;
      background: var(--surface-1);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      transition: border-color var(--t-fast), background-color var(--t-fast),
                  box-shadow var(--t-base);
    }
    .search-box:focus-within {
      border-color: rgba(225, 48, 108, 0.40);
      background: var(--surface-2);
      box-shadow: 0 0 0 3px rgba(225, 48, 108, 0.15);
    }
    .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .search-box:focus-within .search-icon {
      color: var(--ig-pink);
    }
    .search-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font: inherit;
      font-size: 13px;
      letter-spacing: -0.01em;
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }
    /* Squelch the native Safari/Chrome search clear so we can show our own */
    .search-input::-webkit-search-decoration,
    .search-input::-webkit-search-cancel-button,
    .search-input::-webkit-search-results-button,
    .search-input::-webkit-search-results-decoration {
      -webkit-appearance: none;
    }
    .search-clear {
      width: 28px;
      height: 28px;
      min-height: 0;
      padding: 0;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: var(--surface-2);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--t-fast), color var(--t-fast);
    }
    .search-clear:hover {
      background: var(--surface-3);
      color: var(--text-primary);
    }
    .search-clear[hidden] { display: none; }

    /* Result count row below the toolbar, visible only when a query is set */
    .search-meta {
      margin: calc(var(--space-3) * -1) 0 var(--space-3);
      padding: var(--space-2) var(--space-3);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .search-meta[hidden] { display: none; }
    .search-meta strong {
      color: var(--text-primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .search-meta .search-meta-clear {
      background: transparent;
      border: none;
      color: var(--ig-pink);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      min-height: 0;
    }
    .search-meta .search-meta-clear:hover { text-decoration: underline; }

    /* Tabs — segmented control with glass + subtle inner shadow */
    .tabs {
      display: inline-flex;
      gap: var(--space-1);
      margin-bottom: var(--space-5);
      padding: 4px;
      background: var(--surface-1);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }
    .tab {
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-pill);
      letter-spacing: -0.01em;
      transition: color var(--t-base), background-color var(--t-base);
    }
    .tab:hover {
      color: var(--text-secondary);
    }
    .tab.active {
      color: var(--text-primary);
      background: linear-gradient(135deg, var(--ig-purple), var(--ig-pink));
      box-shadow: 0 4px 14px rgba(225, 48, 108, 0.30);
    }
    .tab-count {
      margin-left: var(--space-2);
      padding: 2px var(--space-2);
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .tab.active .tab-count {
      background: rgba(255, 255, 255, 0.20);
      color: #fff;
    }

    /* Layout — 40/60 split on desktop, stacks below 1024px */
    #layout {
      display: flex;
      gap: var(--space-5);
      align-items: flex-start;
    }

    /* Viewer Panel — glass surface, floats above the aurora */
    #viewer-wrap {
      position: sticky;
      top: var(--space-5);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: var(--space-4);
      flex: 0 0 38%;
      max-width: 38%;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        0 1px 0 rgba(255, 255, 255, 0.05) inset;
    }
    #viewer-container {
      position: relative;
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    #player {
      width: 100%;
      max-height: 400px;
      background: #000;
      display: none;
      cursor: pointer;
    }
    #image-viewer {
      width: 100%;
      max-height: 400px;
      background: #000;
      object-fit: contain;
      display: none;
      cursor: pointer;
    }
    #viewer-placeholder {
      width: 100%;
      height: 250px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);            /* was #555 (2.6:1) — now ~6:1 */
      font-size: 14px;
    }

    /* Fullscreen button (top-right of preview, shown on hover) */
    #fullscreen-btn {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      width: 44px;                          /* P0-4: touch target ≥44 */
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(0,0,0,0.7);
      border: none;
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background-color var(--t-fast);
    }
    #fullscreen-btn:hover {
      background: var(--ig-pink);
    }
    /* Show on hover OR when the button itself receives keyboard focus */
    #viewer-container:hover #fullscreen-btn,
    #fullscreen-btn:focus-visible {
      display: flex;
    }

    /* Fullscreen overlay — heavy glass blur over gallery, not pure black.
       The gallery stays faintly visible behind so the user keeps context. */
    #fullscreen-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fs-fade 240ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes fs-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #fullscreen-overlay.visible {
      display: flex;
    }
    #fullscreen-overlay #fullscreen-image,
    #fullscreen-overlay #fullscreen-video {
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.60);
      border-radius: var(--radius-md);
    }
    #fullscreen-controls.fullscreen-controls {
      padding: var(--space-2) var(--space-3);
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.50);
    }
    .fullscreen-btn {
      min-height: 36px !important;
      padding: 0 var(--space-3) !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      background: transparent !important;
      border: none !important;
      border-radius: var(--radius-pill) !important;
      color: var(--text-secondary) !important;
      transition: background-color var(--t-fast), color var(--t-fast) !important;
    }
    .fullscreen-btn:hover {
      background: var(--surface-2) !important;
      color: var(--text-primary) !important;
    }
    .fullscreen-btn.active {
      background: linear-gradient(135deg, var(--ig-purple), var(--ig-pink)) !important;
      color: #fff !important;
      box-shadow: 0 2px 12px rgba(225, 48, 108, 0.40) !important;
    }
    #fullscreen-counter {
      color: var(--text-muted) !important;
      font-variant-numeric: tabular-nums !important;
      font-weight: 600 !important;
    }
    #fullscreen-image, #fullscreen-video {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
    }
    #fullscreen-video {
      display: none;
    }
    #fullscreen-close {
      position: absolute;
      top: var(--space-5);
      right: var(--space-5);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-primary);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background-color var(--t-fast);
    }
    #fullscreen-close:hover {
      background: var(--ig-pink);
    }
    #fullscreen-controls {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: var(--space-3);
      align-items: center;
    }
    .fullscreen-btn {
      min-height: var(--btn-h-md);          /* P0-4 */
      padding: 10px 20px;
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: background-color var(--t-fast);
    }
    .fullscreen-btn:hover {
      background: var(--ig-pink);
    }
    .fullscreen-btn.active {
      background: var(--selected);          /* "currently playing" = selected color */
    }
    #fullscreen-counter {
      color: var(--text-muted);             /* was #888 */
      font-size: 14px;
      padding: 0 var(--space-5);
    }

    /* Slideshow controls — segmented control like the tabs above */
    .slideshow-controls {
      margin-top: var(--space-3);
      display: flex;
      gap: var(--space-2);
      align-items: center;
      flex-wrap: wrap;
    }
    .slideshow-controls label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .slideshow-group {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface-1);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
    }
    .slideshow-btn {
      min-height: 30px;
      padding: 0 var(--space-3);
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: color var(--t-fast), background-color var(--t-fast);
    }
    .slideshow-btn:hover {
      color: var(--text-primary);
      background: var(--surface-2);
    }
    .slideshow-btn.active {
      background: var(--selected);
      color: #fff;
      box-shadow: 0 2px 10px var(--selected-glow);
    }

    /* Actions — pill buttons, primary CTA glows */
    .actions {
      margin-top: var(--space-4);
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    button {
      min-height: var(--btn-h-md);
      padding: 0 var(--space-4);
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-1);
      background: var(--surface-1);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition:
        background-color var(--t-fast),
        border-color var(--t-fast),
        transform var(--t-spring),
        box-shadow var(--t-base);
    }
    /* Lucide-style line icons */
    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 20px; height: 20px; }
    /* Icon-only round buttons (close, fullscreen) */
    .icon-btn {
      width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 50%;
    }
    button:hover {
      background: var(--surface-2);
      border-color: var(--border-2);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
    }
    /* The one true primary CTA — Download, with brand glow */
    #download-current {
      background: linear-gradient(135deg, var(--ig-purple), var(--ig-pink));
      border: none;
      box-shadow: 0 4px 16px rgba(225, 48, 108, 0.30);
    }
    #download-current:hover {
      box-shadow: 0 6px 22px rgba(225, 48, 108, 0.45);
      transform: translateY(-2px);
    }
    /* Donate — same brand gradient as primary but softer weight */
    #donate {
      background: linear-gradient(135deg, #f5af19, var(--ig-pink));
      border: none;
      box-shadow: 0 4px 14px rgba(245, 175, 25, 0.25);
    }
    #donate:hover {
      box-shadow: 0 6px 20px rgba(245, 175, 25, 0.40);
      transform: translateY(-2px);
    }

    /* Info */
    #status {
      margin-top: var(--space-3);
      font-size: 12px;
      color: var(--ig-pink);
    }
    #progress {
      margin-top: var(--space-2);
      height: 4px;
      background: #333;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--ig-pink);
      transition: width var(--t-base);
    }


    /* Grid container */
    #grid-container {
      flex: 0 0 60%;
      max-width: 60%;
      min-width: 0;                          /* let it shrink in flex */
    }

    /* Grid — responsive auto-fill */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: var(--space-3);
    }

    /* Cards — sophisticated hover. Scale + glow + ring move in concert,
       on a spring curve. Selection draws an animated outer ring. */
    .card {
      background: var(--surface-2);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1;
      isolation: isolate;
      transition:
        transform var(--t-spring),
        border-color var(--t-base),
        box-shadow var(--t-base);
      animation: card-in 360ms cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }
    /* Subtle stagger — each card fades + slides up. animation-delay set inline
       via gallery.js so the cascade reads visually as a wave. */
    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(225, 48, 108, 0.40);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.40),
        0 0 0 1px rgba(225, 48, 108, 0.30),
        0 0 24px rgba(225, 48, 108, 0.20);
      z-index: 2;
    }
    .card:active {
      transform: translateY(-1px) scale(1.01);
    }
    /* Selected — animated double ring. The outer ring "draws" with a slight
       grow on entry; the inner border tightens. Color reserved for selection. */
    .card.selected {
      border-color: var(--selected);
      box-shadow:
        0 0 0 2px var(--selected),
        0 0 28px var(--selected-glow),
        0 8px 24px rgba(0, 0, 0, 0.40);
      animation: card-select 480ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes card-select {
      0%   { box-shadow: 0 0 0 0 var(--selected),
                         0 0 0 var(--selected-glow); }
      60%  { box-shadow: 0 0 0 4px var(--selected),
                         0 0 36px var(--selected-glow); }
      100% { box-shadow: 0 0 0 2px var(--selected),
                         0 0 28px var(--selected-glow),
                         0 8px 24px rgba(0, 0, 0, 0.40); }
    }
    .card:focus-visible {
      outline-offset: 4px;
    }
    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0a0a0a;
    }
    .video-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      background: rgba(0,0,0,0.7);
      color: var(--text-primary);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
    /* Carousel indicator — Instagram's own album glyph in a glassmorphic
       chip. The chip blurs whatever's behind it so the icon reads on any
       photo (light/dark/busy) without looking like a flat sticker. */
    .carousel-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      /* Tic-tac proportions: ~52 × 24, ratio ~2.1. The wider horizontal
         padding keeps single-digit counts from collapsing into a circle. */
      padding: 5px 13px 5px 11px;
      min-width: 46px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(20, 20, 30, 0.55);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-pill);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      line-height: 1;
      cursor: pointer;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.40),
        0 1px 0 rgba(255, 255, 255, 0.08) inset;
      transition:
        background-color var(--t-fast),
        border-color var(--t-fast),
        transform var(--t-fast),
        box-shadow var(--t-base);
    }
    .carousel-indicator:hover {
      background: rgba(225, 48, 108, 0.55);  /* brand-pink wash on hover */
      border-color: rgba(255, 255, 255, 0.22);
      transform: scale(1.06);
      box-shadow:
        0 4px 14px rgba(225, 48, 108, 0.40),
        0 1px 0 rgba(255, 255, 255, 0.12) inset;
    }
    .carousel-indicator:active {
      transform: scale(1.02);
    }
    .carousel-indicator .ci-icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Safari < 18 / very old Chromium fallback: backdrop-filter not supported
       → fall back to a stronger solid dark so the icon still reads. */
    @supports not (backdrop-filter: blur(1px)) {
      .carousel-indicator {
        background: rgba(0, 0, 0, 0.72);
      }
    }
    .card.carousel-expanded .carousel-indicator {
      display: none;
    }

    /* ---- Expanded carousel drawer ----------------------------------------
       Card breaks its 1-column footprint and lays out as:
         [ cover hero (180px) ] [ slide drawer (flex) ]
       The cover stays visible to preserve continuity — the user clicked an
       album, and they should keep seeing that album's identity. The drawer
       slides in from the right with an Apple-style ease. */
    .card.carousel-expanded {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      height: 220px;
      display: flex;
      align-items: stretch;
      cursor: default;
      border-color: var(--glass-border);
      box-shadow:
        0 0 0 1px rgba(225, 48, 108, 0.45),
        0 24px 60px rgba(0, 0, 0, 0.50);
      transform: none;
      transition:
        box-shadow var(--t-base),
        border-color var(--t-base);
    }
    .card.carousel-expanded:hover {
      transform: none;
    }
    /* Cover stays visible as a hero on the left */
    .card.carousel-expanded > .thumb {
      width: 220px;
      height: 100%;
      flex-shrink: 0;
      border-right: 1px solid var(--glass-border);
    }
    /* Meta overlay irrelevant in expanded state */
    .card.carousel-expanded > .meta-overlay {
      display: none;
    }
    /* The drawer that holds the slide strip */
    .carousel-drawer {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: var(--space-3) var(--space-3) var(--space-2);
      background:
        linear-gradient(to right, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.15) 30%, transparent 60%),
        var(--glass-bg);
      animation: drawer-open 360ms cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes drawer-open {
      from { opacity: 0; transform: translateX(8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    /* Close animation — slightly shorter than enter but not snappy. A gentle
       ease (cubic-bezier 0.4, 0, 0.6, 1) keeps it deliberate; the larger
       translate makes the drawer feel like it's gliding off, not vanishing. */
    .carousel-drawer.is-closing {
      animation: drawer-close 320ms cubic-bezier(0.4, 0, 0.6, 1) forwards;
      pointer-events: none;  /* lock interactions during the fadeout */
    }
    @keyframes drawer-close {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to   { opacity: 0; transform: translateX(22px) scale(0.97); }
    }
    .carousel-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-2);
      padding: 0 var(--space-1);
    }
    .carousel-drawer-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .carousel-drawer-title strong {
      color: var(--text-primary);
      font-weight: 700;
      margin-right: 4px;
    }
    .carousel-drawer-close {
      width: 28px;
      height: 28px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      border: 1px solid var(--border-1);
      background: var(--surface-1);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--t-fast), color var(--t-fast);
    }
    .carousel-drawer-close:hover {
      background: var(--surface-2);
      color: var(--text-primary);
    }
    .carousel-drawer-close .icon {
      width: 14px;
      height: 14px;
    }

    /* The horizontal slide strip */
    .carousel-strip {
      flex: 1;
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      overflow-y: hidden;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.20) transparent;
      padding: 2px 2px 8px;
    }
    .carousel-strip::-webkit-scrollbar { height: 6px; }
    .carousel-strip::-webkit-scrollbar-track { background: transparent; }
    .carousel-strip::-webkit-scrollbar-thumb {
      background: rgba(225, 48, 108, 0.35);
      border-radius: var(--radius-pill);
    }
    .carousel-strip::-webkit-scrollbar-thumb:hover {
      background: rgba(225, 48, 108, 0.55);
    }
    .carousel-strip-slide {
      flex: 0 0 auto;
      width: 140px;
      height: 140px;
      padding: 0;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--surface-2);
      cursor: pointer;
      scroll-snap-align: start;
      isolation: isolate;
      transition:
        transform var(--t-spring),
        border-color var(--t-base),
        box-shadow var(--t-base);
      /* Per-slide stagger — JS sets the --i custom prop for the delay. */
      animation: slide-in 360ms cubic-bezier(0.32, 0.72, 0, 1) backwards;
      animation-delay: calc(var(--i, 0) * 45ms + 80ms);
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(20px) scale(0.96); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .carousel-strip-slide:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: rgba(225, 48, 108, 0.45);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      z-index: 2;
    }
    .carousel-strip-slide.active {
      border-color: var(--selected);
      box-shadow: 0 0 0 2px var(--selected), 0 0 18px var(--selected-glow);
    }
    .carousel-strip-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .meta-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px 8px 6px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: var(--text-primary);
      font-size: 10px;
      pointer-events: none;
    }
    .meta-overlay .meta-owner {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Viewer metadata block (under the preview) */
    #viewer-meta {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      display: none;
    }
    #viewer-meta.visible {
      display: block;
    }
    #viewer-meta .vm-head {
      color: var(--text-muted);
      font-size: 11px;
      margin-bottom: var(--space-1);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1) 6px;
    }
    #viewer-meta .vm-owner {
      color: var(--ig-pink);
      font-weight: 600;
    }
    #viewer-meta .vm-album {
      color: var(--text-primary);
    }
    #viewer-meta .vm-caption {
      color: var(--text-secondary);
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-link {
      display: inline-block;
      background: linear-gradient(135deg, #833ab4, var(--ig-pink));
      color: var(--text-primary);
      text-decoration: none;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-weight: 500;
      transition: opacity var(--t-base);
    }
    .btn-link:hover {
      opacity: 0.9;
    }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: var(--space-4);
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: var(--btn-h-sm);
      min-height: var(--btn-h-sm);            /* P0-4: was 32px */
      padding: 0 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-1);
      background: var(--surface-1);
      color: var(--text-primary);
      font-size: 12px;
      cursor: pointer;
      transition: border-color var(--t-fast), background-color var(--t-fast);
    }
    .page-btn:hover {
      border-color: var(--ig-pink);
    }
    .page-btn.active {
      background: var(--selected);
      border-color: var(--selected);
    }
    .page-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .page-info {
      font-size: 12px;
      color: var(--text-muted);              /* was #888 (3.6:1) — now ~6.2:1 */
      padding: 0 var(--space-2);
    }

    /* Empty state — generous whitespace + breathing icon */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--space-7) var(--space-5);
      color: var(--text-muted);
    }
    .empty-state .es-icon {
      font-size: 64px;
      margin-bottom: var(--space-4);
      opacity: 0.4;
      animation: breathe 3.6s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.30; transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(1.05); }
    }
    .empty-state h3 {
      color: var(--text-primary);
      margin: 0 0 var(--space-2);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .empty-state p {
      color: var(--text-muted);
      margin: 0 auto var(--space-5);
      max-width: 420px;
      line-height: 1.6;
      font-size: 14px;
    }

    /* Pagination — refined pill buttons */
    .pagination {
      gap: var(--space-1) !important;
      margin-top: var(--space-5) !important;
    }
    .page-btn {
      min-width: 36px !important;
      min-height: 36px !important;
      border-radius: var(--radius-sm) !important;
      background: var(--surface-1) !important;
      border: 1px solid var(--glass-border) !important;
      font-weight: 600 !important;
      font-variant-numeric: tabular-nums !important;
      transition: background-color var(--t-fast), border-color var(--t-fast) !important;
    }
    .page-btn:hover:not(:disabled) {
      background: var(--surface-2) !important;
      border-color: var(--border-2) !important;
    }
    .page-btn.active {
      background: linear-gradient(135deg, var(--ig-purple), var(--ig-pink)) !important;
      border-color: transparent !important;
      color: #fff !important;
      box-shadow: 0 4px 14px rgba(225, 48, 108, 0.35) !important;
    }
    .page-info {
      font-size: 12px !important;
      font-weight: 600 !important;
      color: var(--text-muted) !important;
      font-variant-numeric: tabular-nums !important;
    }

    /* P1-4: stack viewer + grid on narrow viewports */
    @media (max-width: 1024px) {
      #layout {
        flex-direction: column;
      }
      #viewer-wrap,
      #grid-container {
        flex: 1 1 auto;
        max-width: 100%;
      }
      #viewer-wrap {
        position: relative;
        top: 0;
        max-height: none;
      }
    }

    #file-input { display: none; }
  </style>
</head>
<body>
  <!-- Lucide-style SVG icon set; referenced via <use href="#i-name"/> -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-maximize" viewBox="0 0 24 24">
      <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M18 6L6 18M6 6l12 12"/>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"/>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24">
      <path d="M9 18l6-6-6-6"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M5 3l14 9-14 9V3z" fill="currentColor"/>
    </symbol>
    <!-- Two offset rounded squares — Instagram's own album glyph. -->
    <symbol id="i-stack" viewBox="0 0 24 24">
      <rect x="7" y="3" width="14" height="14" rx="2.5"/>
      <path d="M16 17v2.5A1.5 1.5 0 0 1 14.5 21h-11A1.5 1.5 0 0 1 2 19.5v-11A1.5 1.5 0 0 1 3.5 7H7"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.35-4.35"/>
    </symbol>
  </svg>

  <h1>Gallery <span id="version"></span></h1>
  
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-tab="images">
        Images <span class="tab-count" id="image-count">0</span>
      </button>
      <button class="tab" data-tab="videos">
        Videos <span class="tab-count" id="video-count">0</span>
      </button>
    </div>
    <div class="search-box" role="search">
      <svg class="search-icon icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
      <input
        id="search-input"
        type="search"
        class="search-input"
        placeholder="Search caption, @user, or #tag…"
        aria-label="Search captured posts"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="search-clear" class="search-clear" hidden aria-label="Clear search">
        <svg class="icon-sm" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
  </div>
  <div class="search-meta" id="search-meta" hidden aria-live="polite"></div>

  <div id="layout">
    <div id="viewer-wrap">
      <div id="viewer-container">
        <div id="viewer-placeholder">Select an item to preview</div>
        <video id="player" controls></video>
        <img id="image-viewer" alt="Preview" />
        <button id="fullscreen-btn" class="icon-btn" aria-label="Open fullscreen viewer" title="Fullscreen">
          <svg class="icon" aria-hidden="true"><use href="#i-maximize"/></svg>
        </button>
      </div>
      
      <div id="viewer-meta"></div>

      <div class="slideshow-controls" id="slideshow-controls">
        <label>Slideshow</label>
        <div class="slideshow-group" role="group" aria-label="Slideshow interval">
          <button class="slideshow-btn" data-interval="2000" aria-label="Auto-advance every 2 seconds">2s</button>
          <button class="slideshow-btn" data-interval="3000" aria-label="Auto-advance every 3 seconds">3s</button>
          <button class="slideshow-btn" data-interval="5000" aria-label="Auto-advance every 5 seconds">5s</button>
          <button class="slideshow-btn" id="stop-slideshow" style="display:none;" aria-label="Stop slideshow">Stop</button>
        </div>
      </div>
      
      <div class="actions">
        <button id="download-current">Download</button>
        <button id="export" title="Export everything as JSON (images + videos with metadata)">Export All</button>
        <button id="import" title="Import a JSON backup (or legacy .txt URL list)">Import</button>
        <button id="copy">Copy Images</button>
        <button id="clear">Clear All</button>
        <button id="donate">Donate</button>
      </div>
      <div id="status"></div>
      <div id="progress"><div id="progress-bar"></div></div>
      <input id="file-input" type="file" accept=".json,.txt,application/json,text/plain" />
      
      </div>
    
    <div id="grid-container">
      <div id="grid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Fullscreen overlay -->
  <div id="fullscreen-overlay">
    <img id="fullscreen-image" alt="Fullscreen" />
    <video id="fullscreen-video" controls autoplay></video>
    <button id="fullscreen-close" class="icon-btn" aria-label="Close fullscreen viewer">
      <svg class="icon icon-lg" aria-hidden="true"><use href="#i-x"/></svg>
    </button>
    <div id="fullscreen-controls" class="fullscreen-controls" role="group" aria-label="Fullscreen controls">
      <button class="fullscreen-btn" id="fullscreen-prev" aria-label="Previous item">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-left"/></svg> Prev
      </button>
      <button class="fullscreen-btn" id="fs-slide-2" data-interval="2000" aria-label="Auto-advance every 2 seconds">2s</button>
      <button class="fullscreen-btn" id="fs-slide-3" data-interval="3000" aria-label="Auto-advance every 3 seconds">3s</button>
      <button class="fullscreen-btn" id="fs-slide-5" data-interval="5000" aria-label="Auto-advance every 5 seconds">5s</button>
      <button class="fullscreen-btn" id="fs-slide-stop" style="display:none;" aria-label="Stop slideshow">Stop</button>
      <span id="fullscreen-counter" aria-live="polite"></span>
      <button class="fullscreen-btn" id="fullscreen-next" aria-label="Next item">
        Next <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-right"/></svg>
      </button>
    </div>
  </div>

  <script src="analytics.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
